<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marweb Caller & SMS</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 60px; }
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        .tab-content { display: none; padding: 15px; }
        .active { display: block; }
        .item-card { background: #1f1f1f; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn { background: #00adb5; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .btn-sms { background: #ff5722; margin-left: 5px; }
        .sms-form { display: flex; flex-direction: column; gap: 10px; }
        input, textarea { background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 5px; font-size: 16px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1f1f1f; display: flex; justify-content: space-around; border-top: 1px solid #333; }
        .nav-btn { background: none; border: none; color: #888; padding: 15px; width: 100%; font-size: 14px; }
        .nav-btn.active-tab { color: #00adb5; font-weight: bold; }
    </style>
</head>
<body>
    <header><h2>Marweb</h2></header>
    <div id="contacts" class="tab-content active">
        <h3>My Contacts</h3>
        <hr style="border-color:#333; margin: 10px 0;">
        <div id="contacts-list">
            <div class="item-card">
                <div><strong>Sample Contact</strong><p style="color:#aaa;">+251 911 000000</p></div>
                <div>
                    <button class="btn" onclick="window.location.href='tel:+251911000000'">Call</button>
                    <button class="btn btn-sms" onclick="document.getElementById('sms-number').value='+251911000000'; switchTab('sms', document.querySelectorAll('.nav-btn')[2])">SMS</button>
                </div>
            </div>
        </div>
    </div>
    <div id="logs" class="tab-content">
        <h3>Call History</h3>
        <hr style="border-color:#333; margin: 10px 0;">
        <div class="item-card">
            <div><strong>Sample Contact</strong><p style="color:#ff5252;">❌ Missed • Today</p></div>
        </div>
    </div>
    <div id="sms" class="tab-content">
        <h3>Send Direct SMS</h3>
        <hr style="border-color:#333; margin: 10px 0;">
        <div class="sms-form">
            <input type="tel" id="sms-number" placeholder="Phone Number">
            <textarea id="sms-message" rows="5" placeholder="Type your message here..."></textarea>
            <button class="btn" style="background:#4caf50; padding:15px;" onclick="let num=document.getElementById('sms-number').value; let msg=document.getElementById('sms-message').value; if(!num||!msg){alert('Fill both!');return;} window.location.href='sms:'+num+'?body='+encodeURIComponent(msg)">Send Message</button>
        </div>
    </div>
    <div class="nav-bar">
        <button class="nav-btn active-tab" onclick="switchTab('contacts', this)">Contacts</button>
        <button class="nav-btn" onclick="switchTab('logs', this)">Call Logs</button>
        <button class="nav-btn" onclick="switchTab('sms', this)">Direct SMS</button>
    </div>
    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active-tab');
        }
    </script>
</body>
</html>
